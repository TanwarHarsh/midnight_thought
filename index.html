<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Midnight Thought — Cast Your Thoughts Into the Night</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase Core Script Connection -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-glow: radial-gradient(circle at 50% 35%, #18365c 0%, #0a192e 50%, #010409 100%);
            --accent: #a6bcff;
            --accent-glow: rgba(166, 188, 255, 0.75);
            --star-glow: rgba(200, 225, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010409;
            background-image: var(--bg-glow);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f0f6fc;
            user-select: none;
        }

        #sky-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .top-header {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 16px rgba(166, 188, 255, 0.7), 0 0 32px rgba(166, 188, 255, 0.35);
            text-transform: uppercase;
            font-weight: 600;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, opacity 0.4s ease;
            animation: pulse-star 3s infinite ease-in-out;
            will-change: transform, opacity;
        }

        .star:hover {
            transform: scale(2.6) !important;
            z-index: 50 !important;
            filter: brightness(1.5);
            box-shadow: 0 0 25px #ffffff, 0 0 45px var(--accent) !important;
        }

        @keyframes pulse-star {
            0%, 100% { opacity: 0.65; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.22); }
        }

        .interface {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 520px;
            text-align: center;
        }

        .input-box {
            background: rgba(15, 32, 56, 0.75);
            border: 1px solid rgba(166, 188, 255, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 22px 26px 18px;
            box-shadow: 0 14px 48px rgba(0, 0, 0, 0.7), 0 0 25px rgba(166, 188, 255, 0.2);
        }

        textarea {
            width: 100%;
            height: 70px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            resize: none;
            font-family: inherit;
            font-size: 0.98rem;
            line-height: 1.5;
            text-align: center;
        }

        textarea::placeholder {
            color: #8da2c0;
            font-style: italic;
        }

        .cast-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(166, 188, 255, 0.15);
        }

        .cast-btn {
            background: linear-gradient(135deg, rgba(166, 188, 255, 0.3) 0%, rgba(166, 188, 255, 0.1) 100%);
            border: 1px solid var(--accent);
            color: #ffffff;
            padding: 9px 26px;
            border-radius: 24px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            box-shadow: 0 0 18px rgba(166, 188, 255, 0.3);
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .cast-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #010409;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .cast-btn:disabled {
            border-color: #30363d;
            color: #586069;
            cursor: not-allowed;
            box-shadow: none;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 9, 0.82);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: rgba(15, 32, 56, 0.92);
            border: 1px solid rgba(166, 188, 255, 0.35);
            padding: 42px 36px 32px;
            border-radius: 26px;
            max-width: 490px;
            width: 88%;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85);
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .overlay.active .modal { transform: translateY(0); }
        .modal-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; color: #f0f6fc; }
        .close-btn { color: #8da2c0; font-size: 0.85rem; text-decoration: underline; cursor: pointer; }
        
        .legal-footer {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            z-index: 10; font-size: 0.7rem; white-space: nowrap;
        }
        .legal-footer a { color: #586069; text-decoration: none; margin: 0 8px; }
        .legal-footer a:hover { color: #a6bcff; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-title">The Midnight Thought</div>
    </div>

    <div id="sky-container"></div>

    <div class="interface">
        <div class="input-box">
            <textarea id="thoughtInput" maxlength="250" placeholder="Release a quiet secret, regret, or dream..."></textarea>
            <div class="cast-actions">
                <button class="cast-btn" id="castBtn">Cast Into Orbit</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <p class="modal-text" id="modalText"></p>
            <span class="close-btn" id="closeBtn">return to the cosmos</span>
        </div>
    </div>

    <div class="legal-footer">
        <a href="privacy.html">Privacy Policy</a> • 
        <a href="terms.html">Terms</a>
    </div>

    <script>
        // 🔑 DROP YOUR SUPABASE DETAILS HERE
        const SUPABASE_URL = 'https://gbzoyrbdflfyfisrvqum.supabase.co/rest/v1/'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdiem95cmJkZmxmeWZpc3J2cXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTEwNzUsImV4cCI6MjEwMzg4NzA3NX0.2OJsJP9wfBZu9u6yLR49lo4vCfpFiz0rbGtSac7ZxK8';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const skyContainer = document.getElementById('sky-container');
        const thoughtInput = document.getElementById('thoughtInput');
        const castBtn = document.getElementById('castBtn');
        const overlay = document.getElementById('overlay');
        const modalText = document.getElementById('modalText');
        const closeBtn = document.getElementById('closeBtn');

        let starSpeedArr = [];

        function checkCooldown() {
            const lastCast = localStorage.getItem('last_cast_time');
            if (lastCast) {
                const diff = (Date.now() - parseInt(lastCast, 10)) / 1000;
                if (diff < 120) {
                    castBtn.disabled = true;
                    castBtn.innerText = `Orbit Lock (${Math.ceil(120 - diff)}s)`;
                    setTimeout(checkCooldown, 1000);
                    return;
                }
            }
            castBtn.disabled = false;
            castBtn.innerText = "Cast Into Orbit";
        }

        function createMovingStar(text) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const x = Math.random() * 90 + 5;
            let y = Math.random() * 55 + 15;
            const size = Math.random() * 4 + 3;
            const speed = 0.05 + Math.random() * 0.08; 

            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.backgroundColor = '#ffffff';
            star.style.boxShadow = `0 0 ${size * 3}px var(--star-glow)`;

            star.addEventListener('click', () => {
                modalText.innerText = text;
                overlay.classList.add('active');
            });

            skyContainer.appendChild(star);
            starSpeedArr.push({ element: star, currentY: y, speed: speed });
        }

        function animateAntigravityLoop() {
            starSpeedArr.forEach(starObj => {
                starObj.currentY -= starObj.speed; 
                if (starObj.currentY < 5) {
                    starObj.currentY = 75;
                }
                starObj.element.style.top = `${starObj.currentY}%`;
            });
            requestAnimationFrame(animateAntigravityLoop);
        }

        async function fetchGlobalThoughts() {
            const { data, error } = await client
                .from('thoughts')
                .select('content')
                .order('created_at', { ascending: false })
                .limit(60);

            if (!error && data) {
                skyContainer.innerHTML = '';
                starSpeedArr = [];
                data.forEach(t => createMovingStar(t.content));
            }
        }

        castBtn.addEventListener('click', async () => {
            const content = thoughtInput.value.trim();
            if (!content) return;

            castBtn.disabled = true;
            castBtn.innerText = "Launching...";

            const { error } = await client.from('thoughts').insert([{ content }]);
            if (!error) {
                createMovingStar(content);
                thoughtInput.value = '';
                localStorage.setItem('last_cast_time', Date.now().toString());
                checkCooldown();
            } else {
                alert("Database transmission failed.");
                castBtn.disabled = false;
                castBtn.innerText = "Cast Into Orbit";
            }
        });

        closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
        overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('active'); });

        fetchGlobalThoughts();
        checkCooldown();
        animateAntigravityLoop();
    </script>
</body>
</html>
