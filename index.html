            color: #f0f6fc;

            height: 42px;

            display: flex;
            align-items: center;

            cursor: pointer;
            backdrop-filter: blur(12px);

            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, opacity 0.4s ease;
            animation: pulse-star 3s infinite ease-in-out;
            will-change: transform, opacity;
        }

        .star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .star:hover {
            transform: scale(2.6) !important;
            z-index: 50 !important;
            filter: brightness(1.5);
            box-shadow: 0 0 25px #ffffff, 0 0 45px var(--accent) !important;
        }

        @keyframes pulse-star {
            0%, 100% { opacity: 0.65; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.22); }
        }

        /* Casting Interface Container */
        .interface {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 520px;
            text-align: center;

        .input-box {

        }
    </style>

        class CelestialAudio {
            constructor() {
                this.ctx = null;

                this.droneGain = null;
                this.oscillators = [];
                this.chimeScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

                this.init();

            startAmbient() {
                if (!this.ctx) return;
                this.droneGain = this.ctx.createGain();
                this.droneGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                this.droneGain.gain.exponentialRampToValueAtTime(0.14, this.ctx.currentTime + 3);
                this.droneGain.connect(this.ctx.destination);

                const baseFreqs = [73.42, 110.0, 146.83, 220.0, 261.63, 329.63];
                this.oscillators = baseFreqs.map((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(freq + (Math.random() * 0.4 - 0.2), this.ctx.currentTime);

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(450 + idx * 60, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.18 / baseFreqs.length, this.ctx.currentTime);
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.droneGain);
                    osc.start();
                    return osc;

                if (this.droneGain) {
                    this.droneGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.5);

                        this.oscillators.forEach(osc => osc.stop());
                        this.oscillators = [];

                    osc.connect(gain);

                    osc.start(now);

            const seedStr = `${thought.id || index}_${thought.text || ''}`;
            let hash = 0;
            for (let i = 0; i < seedStr.length; i++) {

                                x: props.x,
                                y: props.y
                            };
                        });

                        // Check if new items arrived
                        const hasChanges = newThoughts.length !== thoughtsArr.length || 
                                           newThoughts.some((t, i) => !thoughtsArr[i] || t.id !== thoughtsArr[i].id || t.warmth !== thoughtsArr[i].warmth || t.resonate !== thoughtsArr[i].resonate);

                        if (hasChanges) {
                            thoughtsArr = newThoughts;
                            saveThoughtsLocal();
                            renderStars();
                        }
                    }
                } catch(err) {
                    console.warn("Supabase sync notice:", err.message);
                }
            }
        }

        function initRealtime() {
            if (!dbClient) return;
            try {
                const channel = dbClient.channel('thoughts_live_feed');
                
                channel
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'thoughts' }, (payload) => {
                        console.log("Realtime event received:", payload.eventType);
                        loadThoughts(true);
                    })
                    .subscribe((status) => {
                        console.log("Supabase realtime channel status:", status);
                    });
            } catch(e) {
                console.warn("Realtime subscription notice:", e);
            }

            // Fallback: Automatic Background Sync every 5 seconds across all devices
            setInterval(() => {
                loadThoughts(true);
            }, 5000);
        }

        /* ==========================================================================
           3. Starfield & Constellation Canvas Engine
           ========================================================================== */
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        const skyContainer = document.getElementById('sky-container');

        let showConstellations = true;
        let hoveredStarIndex = null;
        let activeThoughtIndex = null;
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            renderStars();
        });
        resizeCanvas();

        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width * 0.85;
                this.y = Math.random() * canvas.height * 0.4;
                this.length = Math.random() * 95 + 60;
                this.speed = Math.random() * 7 + 10;
                this.angle = Math.PI / 4 + (Math.random() * 0.2 - 0.1);
                this.opacity = 1;
                this.decay = Math.random() * 0.015 + 0.012;
                this.active = true;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= this.decay;
                if (this.opacity <= 0) {
                    this.active = false;
                }
            }

            draw(ctx) {
                if (!this.active) return;
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;

                const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                grad.addColorStop(0, 'rgba(166, 188, 255, 0)');
                grad.addColorStop(0.7, `rgba(200, 220, 255, ${this.opacity * 0.6})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${this.opacity})`);

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2.4;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#a6bcff';
                ctx.stroke();
                ctx.restore();
            }
        }

        function scheduleShootingStar() {
            const delay = Math.random() * 6000 + 4000;
            setTimeout(() => {
                const sStar = new ShootingStar();
                shootingStars.push(sStar);
                audio.playShootingStarSound();
                scheduleShootingStar();
            }, delay);
        }
        scheduleShootingStar();

        function renderStars() {
            skyContainer.innerHTML = '';
            thoughtsArr.forEach((thought, index) => {
                createStarElement(thought, index);
            });
        }

        function createStarElement(thought, index) {
            const props = getDeterministicProps(thought, index);
            thought.x = props.x;
            thought.y = props.y;
            thought.colorIndex = props.colorIndex;

            const palette = starColors[props.colorIndex % starColors.length];
            const star = document.createElement('div');
            star.classList.add('star');
            star.dataset.index = index;

            star.style.left = `${props.x}%`;
            star.style.top = `${props.y}%`;
            star.style.width = `${props.size}px`;
            star.style.height = `${props.size}px`;
            star.style.backgroundColor = palette.color;
            star.style.boxShadow = `0 0 ${props.size * 3.5}px ${palette.glow}, 0 0 ${props.size * 7}px ${palette.color}, 0 0 ${props.size * 12}px ${palette.glow}`;
            star.style.animationDelay = `${props.delay}s`;

            star.addEventListener('mouseenter', () => {
                hoveredStarIndex = index;
                audio.playChime(index);
            });

            star.addEventListener('mouseleave', () => {
                hoveredStarIndex = null;
            });

            star.addEventListener('click', () => {
                openThoughtModal(index);
            });

            skyContainer.appendChild(star);
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (showConstellations) {
                const starPoints = [];
                const starElements = document.querySelectorAll('.star');

                starElements.forEach(el => {
                    const idx = parseInt(el.dataset.index);
                    const rect = el.getBoundingClientRect();
                    starPoints.push({
                        index: idx,
                        x: rect.left + rect.width / 2,
                        y: rect.top + rect.height / 2
                    });
                });

                const maxDistance = Math.min(canvas.width, canvas.height) * 0.28;

                for (let i = 0; i < starPoints.length; i++) {
                    for (let j = i + 1; j < starPoints.length; j++) {
                        const p1 = starPoints[i];
                        const p2 = starPoints[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < maxDistance) {
                            const isHoverLinked = (hoveredStarIndex === p1.index || hoveredStarIndex === p2.index);
                            const alpha = isHoverLinked 
                                ? (1 - dist / maxDistance) * 0.85 + 0.35 
                                : (1 - dist / maxDistance) * 0.26;

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            
                            if (isHoverLinked) {
                                ctx.strokeStyle = `rgba(166, 188, 255, ${alpha})`;
                                ctx.lineWidth = 2.0;
                                ctx.shadowBlur = 14;
                                ctx.shadowColor = '#a6bcff';
                            } else {
                                ctx.strokeStyle = `rgba(200, 220, 255, ${alpha})`;
                                ctx.lineWidth = 1.0;
                                ctx.shadowBlur = 4;
                                ctx.shadowColor = 'rgba(166, 188, 255, 0.4)';
                            }
                            ctx.stroke();
                        }
                    }
                }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const sStar = shootingStars[i];
                sStar.update();
                sStar.draw(ctx);
                if (!sStar.active) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        requestAnimationFrame(animateCanvas);

        /* ==========================================================================
           4. Modal & Reactions Handling
           ========================================================================== */
        const overlay = document.getElementById('overlay');
        const modalText = document.getElementById('modalText');
        const warmthBtn = document.getElementById('warmthBtn');
        const warmthCount = document.getElementById('warmthCount');
        const resonateBtn = document.getElementById('resonateBtn');
        const resonateCount = document.getElementById('resonateCount');
        const closeBtn = document.getElementById('closeBtn');

        function openThoughtModal(index) {
            activeThoughtIndex = index;
            const thought = thoughtsArr[index];

            modalText.innerText = `"${thought.text}"`;
            warmthCount.innerText = thought.warmth || 0;
            resonateCount.innerText = thought.resonate || 0;

            const sessionReactions = JSON.parse(sessionStorage.getItem(`reacted_${thought.id}`) || '{}');
            warmthBtn.classList.toggle('reacted', !!sessionReactions.warmth);
            resonateBtn.classList.toggle('reacted', !!sessionReactions.resonate);

            overlay.classList.add('active');
            audio.playChime(index);
        }

        function closeModal() {
            overlay.classList.remove('active');
            activeThoughtIndex = null;
        }

        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) {
                closeModal();
            }
        });

        async function handleReaction(type) {
            if (activeThoughtIndex === null) return;
            const thought = thoughtsArr[activeThoughtIndex];
            const sessionKey = `reacted_${thought.id}`;
            let sessionReactions = JSON.parse(sessionStorage.getItem(sessionKey) || '{}');

            const isInc = !sessionReactions[type];
            sessionReactions[type] = isInc;

            if (type === 'warmth') {
                thought.warmth = Math.max(0, (thought.warmth || 0) + (isInc ? 1 : -1));
                warmthBtn.classList.toggle('reacted', isInc);
                warmthCount.innerText = thought.warmth;
                if (isInc) {
                    showToast("✨ Sent warmth into the night");
                    audio.playChime(activeThoughtIndex + 2);
                }
            } else if (type === 'resonate') {
                thought.resonate = Math.max(0, (thought.resonate || 0) + (isInc ? 1 : -1));
                resonateBtn.classList.toggle('reacted', isInc);
                resonateCount.innerText = thought.resonate;
                if (isInc) {
                    showToast("🤍 You are not alone in this feeling");
                    audio.playChime(activeThoughtIndex + 4);
                }
            }

            sessionStorage.setItem(sessionKey, JSON.stringify(sessionReactions));
            saveThoughtsLocal();

            if (dbClient && !isNaN(Number(thought.id))) {
                try {
                    await dbClient
                        .from('thoughts')
                        .update({ [type]: thought[type] })
                        .eq('id', Number(thought.id));
                } catch(e) {
                    console.warn("Supabase reaction update notice:", e);
                }
            }
        }

        warmthBtn.addEventListener('click', () => handleReaction('warmth'));
        resonateBtn.addEventListener('click', () => handleReaction('resonate'));

        /* ==========================================================================
           5. Casting Interface (Dual-Storage Architecture)
           ========================================================================== */
        const thoughtInput = document.getElementById('thoughtInput');
        const castBtn = document.getElementById('castBtn');
        const charCount = document.getElementById('charCount');

        thoughtInput.addEventListener('input', () => {
            charCount.innerText = `${thoughtInput.value.length}/250`;
        });

        async function castThought() {
            const text = thoughtInput.value.trim();
            if (!text) return;

            const colorIdx = Math.floor(Math.random() * starColors.length);
            const coordX = Number((Math.random() * 84 + 8).toFixed(2));
            const coordY = Number((Math.random() * 50 + 18).toFixed(2));

            const tempId = "local_" + Date.now().toString();
            let newThought = {
                id: tempId,
                text: text,
                warmth: 1,
                resonate: 0,
                colorIndex: colorIdx,
                x: coordX,
                y: coordY
            };

            // 1. Immediately store in local memory & storage
            thoughtsArr.push(newThought);
            saveThoughtsLocal();
            createStarElement(newThought, thoughtsArr.length - 1);

            // 2. Audio & Visual FX
            audio.playCastShimmer();
            const sStar = new ShootingStar();
            shootingStars.push(sStar);

            thoughtInput.value = '';
            charCount.innerText = '0/250';
            castBtn.innerText = "Casted ✨";
            showToast("Your thought has taken its place among the stars.");

            setTimeout(() => {
                castBtn.innerText = "Cast Into the Night";
            }, 2200);

            // 3. Cloud Sync with Supabase (with schema adaptation fallback)
            if (dbClient) {
                try {
                    let { data, error } = await dbClient
                        .from('thoughts')
                        .insert([
                            {
                                text: text,
                                warmth: 1,
                                resonate: 0,
                                color_index: colorIdx,
                                x: coordX,
                                y: coordY
                            }
                        ])
                        .select();

                    // Fallback to minimal schema if columns don't match
                    if (error) {
                        const retry = await dbClient
                            .from('thoughts')
                            .insert([{ text: text, warmth: 1, resonate: 0 }])
                            .select();
                        data = retry.data;
                        error = retry.error;
                    }

                    if (error) {
                        console.error("Supabase cloud insert error:", error.message);
                        showToast("✨ Thought cast into sky (Saved locally)");
                    } else if (data && data.length > 0) {
                        newThought.id = data[0].id.toString();
                        saveThoughtsLocal();
                    }
                } catch(err) {
                    console.warn("Supabase network notice:", err.message);
                }
            }
        }

        castBtn.addEventListener('click', castThought);
        thoughtInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                castThought();
            }
        });

        /* ==========================================================================
           6. Controls
           ========================================================================== */
        const constellationToggle = document.getElementById('constellationToggle');
        constellationToggle.addEventListener('click', () => {
            showConstellations = !showConstellations;
            constellationToggle.classList.toggle('active', showConstellations);
            showToast(showConstellations ? "Constellations revealed" : "Constellations hidden");
        });

        const audioToggle = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        audioToggle.addEventListener('click', () => {
            const active = audio.toggle();
            audioToggle.classList.toggle('active', active);
            audioIcon.innerText = active ? '🌌' : '🔇';
            showToast(active ? "Ambient night audio enabled" : "Audio muted");
        });

        const toast = document.getElementById('toast');
        let toastTimeout = null;
        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize App & Load Data
        loadThoughts();
        initRealtime();
    </script>
</body>
</html>
