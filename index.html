<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Midnight Thought (v11) — 3D Celestial Sky & Anonymous Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-glow: radial-gradient(circle at 50% 35%, #18365c 0%, #0a192e 50%, #010409 100%);
            --accent: #a6bcff;
            --accent-glow: rgba(166, 188, 255, 0.75);
            --star-white: #ffffff;
            --star-white-glow: rgba(255, 255, 255, 0.95);
            --star-yellow: #ffd166;
            --star-yellow-glow: rgba(255, 209, 102, 0.95);
            --star-mine: #00f0ff;
            --star-mine-glow: rgba(0, 240, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010409;
            background-image: var(--bg-glow);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f0f6fc;
            user-select: none;
            touch-action: none;
        }

        /* 3D Celestial Viewport */
        #viewport-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            overflow: hidden;
            cursor: grab;
            z-index: 1;
        }

        #viewport-3d:active {
            cursor: grabbing;
        }

        #sky-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
            pointer-events: none;
        }

        #sky-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        /* Top controls header */
        .top-header {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 16px rgba(166, 188, 255, 0.7), 0 0 32px rgba(166, 188, 255, 0.35);
            text-transform: uppercase;
            font-weight: 600;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .active-users-badge, .total-thoughts-badge, .my-vault-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 36, 64, 0.65);
            border: 1px solid rgba(166, 188, 255, 0.35);
            backdrop-filter: blur(12px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.76rem;
            color: #d0e0ff;
            letter-spacing: 0.5px;
            box-shadow: 0 0 14px rgba(166, 188, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .total-thoughts-badge {
            color: #ffe8a3;
            border-color: rgba(255, 214, 102, 0.4);
            box-shadow: 0 0 14px rgba(255, 214, 102, 0.15);
            cursor: default;
        }

        .my-vault-btn {
            background: rgba(0, 240, 255, 0.12);
            border-color: rgba(0, 240, 255, 0.5);
            color: #a5f3fc;
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
            font-weight: 600;
        }

        .my-vault-btn:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--star-mine);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
            transform: translateY(-1px);
        }

        .my-vault-btn.guest {
            background: rgba(166, 188, 255, 0.12);
            border-color: rgba(166, 188, 255, 0.4);
            color: #d0e0ff;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 18px #10b981;
            animation: pulse-dot 2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.8); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(24, 54, 92, 0.7);
            border: 1px solid rgba(166, 188, 255, 0.45);
            color: #f0f6fc;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-size: 1.15rem;
            box-shadow: 0 0 12px rgba(166, 188, 255, 0.25);
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 22px var(--accent-glow);
            transform: scale(1.1);
        }

        .icon-btn.active {
            background: rgba(166, 188, 255, 0.3);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* 3D Interactive Star in Sky (+10% Size Increase & Color System) */
        .star {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, background-color 0.4s ease;
            animation: pulse-star 3.2s infinite ease-in-out;
            will-change: transform, opacity;
            pointer-events: auto;
        }

        /* Hit-box extension for easy tapping on mobile/desktop */
        .star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* 1. UNREAD STARS: Pure Celestial White */
        .star.unread {
            background-color: var(--star-white) !important;
            box-shadow: 0 0 16px var(--star-white-glow), 0 0 32px var(--star-white), 0 0 48px var(--star-white-glow);
        }

        /* 2. READ STARS: Warm Golden Amber Yellow */
        .star.read {
            background-color: var(--star-yellow) !important;
            box-shadow: 0 0 16px var(--star-yellow-glow), 0 0 32px var(--star-yellow), 0 0 50px rgba(255, 183, 3, 0.8);
        }

        /* 3. USER'S OWN POSTED STARS: Radiant Electric Cyan */
        .star.mine {
            background-color: var(--star-mine) !important;
            box-shadow: 0 0 18px var(--star-mine-glow), 0 0 36px var(--star-mine), 0 0 54px rgba(0, 240, 255, 0.9);
            animation: pulse-mine-star 2.6s infinite ease-in-out;
        }

        .star:hover {
            transform: scale(2.6) !important;
            z-index: 50 !important;
            filter: brightness(1.6);
        }

        @keyframes pulse-star {
            0%, 100% { opacity: 0.7; transform: scale(0.93); }
            50% { opacity: 1; transform: scale(1.24); }
        }

        @keyframes pulse-mine-star {
            0%, 100% { opacity: 0.85; transform: scale(0.96); box-shadow: 0 0 16px var(--star-mine-glow), 0 0 32px var(--star-mine); }
            50% { opacity: 1; transform: scale(1.30); box-shadow: 0 0 24px var(--star-mine-glow), 0 0 46px var(--star-mine), 0 0 60px rgba(0, 240, 255, 0.95); }
        }

        /* 3D Navigation Guide Tip & Legend */
        .hint-drag {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(166, 188, 255, 0.65);
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 32, 56, 0.4);
            padding: 5px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(166, 188, 255, 0.15);
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-unread { background: #ffffff; box-shadow: 0 0 6px #fff; }
        .dot-read { background: #ffd166; box-shadow: 0 0 6px #ffd166; }
        .dot-mine { background: #00f0ff; box-shadow: 0 0 6px #00f0ff; }

        /* Casting Interface */
        .interface {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 90%;
            max-width: 520px;
            text-align: center;
            pointer-events: auto;
        }

        .input-box {
            background: rgba(15, 32, 56, 0.75);
            border: 1px solid rgba(166, 188, 255, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 20px 24px 16px;
            box-shadow: 0 14px 48px rgba(0, 0, 0, 0.7), 0 0 25px rgba(166, 188, 255, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 16px 52px rgba(0, 0, 0, 0.8), 0 0 35px var(--accent-glow);
        }

        textarea {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: block;
            height: 68px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            resize: none;
            font-family: inherit;
            font-size: 0.98rem;
            line-height: 1.5;
            text-align: center;
            font-weight: 400;
            padding: 6px 10px;
            overflow-y: auto;
        }

        textarea::placeholder {
            color: #8da2c0;
            font-style: italic;
        }

        .cast-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(166, 188, 255, 0.15);
        }

        .cast-btn {
            background: linear-gradient(135deg, rgba(166, 188, 255, 0.3) 0%, rgba(166, 188, 255, 0.1) 100%);
            border: 1px solid var(--accent);
            color: #ffffff;
            padding: 9px 26px;
            border-radius: 24px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            box-shadow: 0 0 18px rgba(166, 188, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-left: auto;
        }

        .cast-btn:hover {
            background: var(--accent);
            color: #010409;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        .char-count {
            font-size: 0.75rem;
            color: #8da2c0;
        }

        /* Modal Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 9, 0.82);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: rgba(15, 32, 56, 0.94);
            border: 1px solid rgba(166, 188, 255, 0.35);
            padding: 38px 36px 30px;
            border-radius: 26px;
            max-width: 490px;
            width: 88%;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(166, 188, 255, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-badge {
            display: inline-block;
            margin-bottom: 14px;
            font-size: 0.74rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 16px;
            font-weight: 600;
        }

        .modal-badge.mine {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .modal-text {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.24rem;
            line-height: 1.75;
            margin-bottom: 18px;
            color: #ffffff;
            white-space: pre-wrap;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        /* Message Exact Timestamp Styling */
        .modal-timestamp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.78rem;
            color: #a6bcff;
            opacity: 0.85;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .modal-timestamp svg {
            opacity: 0.75;
        }

        .modal-reactions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .reaction-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 9px 20px;
            border-radius: 22px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reaction-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.06);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }

        .reaction-btn.reacted {
            background: rgba(255, 107, 107, 0.25);
            border-color: #ff6b6b;
            color: #ff9e9e;
            box-shadow: 0 0 22px rgba(255, 107, 107, 0.5);
        }

        .reaction-btn .sparkle-icon {
            font-size: 1.05rem;
            transition: transform 0.3s ease;
        }

        .reaction-count {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .close-btn {
            color: #a5b4fc;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            padding: 4px 12px;
        }

        .close-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(166, 188, 255, 0.6);
        }

        /* ==========================================================================
           COSMIC VAULT MODAL & FORM STYLES (v11)
           ========================================================================== */
        .vault-modal {
            max-width: 580px;
            width: 92%;
            text-align: left;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 32px 30px 26px;
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(166, 188, 255, 0.2);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .vault-title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.25rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 2px;
        }

        .vault-body {
            overflow-y: auto;
            padding-right: 6px;
            flex: 1;
        }

        .vault-body::-webkit-scrollbar {
            width: 5px;
        }

        .vault-body::-webkit-scrollbar-thumb {
            background: rgba(166, 188, 255, 0.25);
            border-radius: 10px;
        }

        .choice-card {
            background: rgba(16, 36, 64, 0.65);
            border: 1px solid rgba(166, 188, 255, 0.25);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .choice-card:hover {
            border-color: rgba(166, 188, 255, 0.6);
            background: rgba(16, 36, 64, 0.9);
            box-shadow: 0 0 20px rgba(166, 188, 255, 0.15);
        }

        .choice-title {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .choice-desc {
            font-size: 0.8rem;
            color: #b0c4de;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3) 0%, rgba(0, 240, 255, 0.1) 100%);
            border: 1px solid #00f0ff;
            color: #ffffff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #00f0ff;
            color: #010409;
            box-shadow: 0 0 26px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(166, 188, 255, 0.35);
            color: #d0e0ff;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            color: #ffffff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.74rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .form-card {
            background: rgba(8, 22, 40, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
            text-align: left;
        }

        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a5f3fc;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(166, 188, 255, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
        }

        .form-error {
            display: none;
            font-size: 0.76rem;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            line-height: 1.4;
            text-align: left;
        }

        .key-display-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 14px;
            padding: 12px 16px;
            margin: 14px 0;
        }

        .key-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.92rem;
            color: #00f0ff;
            word-break: break-all;
            flex: 1;
            user-select: text;
        }

        .my-thoughts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .my-thought-card {
            background: rgba(16, 36, 64, 0.55);
            border: 1px solid rgba(166, 188, 255, 0.2);
            border-radius: 16px;
            padding: 14px 18px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .my-thought-card:hover {
            border-color: #00f0ff;
            background: rgba(16, 36, 64, 0.85);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
            transform: translateX(4px);
        }

        .my-thought-quote {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .my-thought-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.74rem;
            color: #8da2c0;
        }

        .my-thought-stats {
            display: flex;

                    filter.connect(gain);
                    gain.connect(this.droneGain);
                    osc.start();

            isDragging = true;
            hasMoved = false;
            dragStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            dragStartY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        }

        function onPointerMove(e) {
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

            if (isDragging) {
                const deltaX = clientX - dragStartX;
                const deltaY = clientY - dragStartY;
                if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
                    hasMoved = true;
                }
                targetRotY += deltaX * 0.045;
                targetRotX -= deltaY * 0.045;

                targetPanX += deltaX * 0.25;
                targetPanY += deltaY * 0.25;

                targetRotX = Math.max(-28, Math.min(28, targetRotX));
                targetRotY = Math.max(-45, Math.min(45, targetRotY));
                targetPanX = Math.max(-120, Math.min(120, targetPanX));
                targetPanY = Math.max(-80, Math.min(80, targetPanY));

                dragStartX = clientX;
                dragStartY = clientY;
            }
        }

        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width * 0.85;
                this.y = Math.random() * canvas.height * 0.4;
                this.length = Math.random() * 95 + 60;
                this.speed = Math.random() * 7 + 10;
                this.angle = Math.PI / 4 + (Math.random() * 0.2 - 0.1);
                this.opacity = 1;
                this.decay = Math.random() * 0.015 + 0.012;
                this.active = true;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= this.decay;
                if (this.opacity <= 0) {
                    this.active = false;
                }
            }

            draw(ctx) {
                if (!this.active) return;
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;

                const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                grad.addColorStop(0, 'rgba(166, 188, 255, 0)');
                grad.addColorStop(0.7, `rgba(200, 220, 255, ${this.opacity * 0.6})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${this.opacity})`);

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2.4;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#a6bcff';
                ctx.stroke();
                ctx.restore();
            }
        }

        function scheduleShootingStar() {
            const delay = Math.random() * 6000 + 4000;

        function animateCanvas() {
            curRotX += (targetRotX - curRotX) * 0.08;
            curRotY += (targetRotY - curRotY) * 0.08;
            curPanX += (targetPanX - curPanX) * 0.08;
            curPanY += (targetPanY - curPanY) * 0.08;

            skyStage.style.transform = `translate3d(${curPanX}px, ${curPanY}px, 0) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (showConstellations) {
                const starPoints = [];
                const starElements = document.querySelectorAll('.star');
                const stageRect = skyStage.getBoundingClientRect();

                starElements.forEach(el => {
                    const idx = parseInt(el.dataset.index);
                    const rect = el.getBoundingClientRect();
                    starPoints.push({
                        index: idx,
                        x: (rect.left + rect.width / 2 - stageRect.left) + canvas.width * 0.166,
                        y: (rect.top + rect.height / 2 - stageRect.top) + canvas.height * 0.166
                    });
                });

                const maxDistance = Math.min(window.innerWidth, window.innerHeight) * 0.28;

                for (let i = 0; i < starPoints.length; i++) {
                    for (let j = i + 1; j < starPoints.length; j++) {
                        const p1 = starPoints[i];
                        const p2 = starPoints[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < maxDistance) {
                            const isHoverLinked = (hoveredStarIndex === p1.index || hoveredStarIndex === p2.index);
                            const alpha = isHoverLinked 
                                ? (1 - dist / maxDistance) * 0.85 + 0.35 
                                : (1 - dist / maxDistance) * 0.26;

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            
                            if (isHoverLinked) {
                                ctx.strokeStyle = `rgba(166, 188, 255, ${alpha})`;
                                ctx.lineWidth = 2.0;
                                ctx.shadowBlur = 14;
                                ctx.shadowColor = '#a6bcff';
                            } else {
                                ctx.strokeStyle = `rgba(200, 220, 255, ${alpha})`;
                                ctx.lineWidth = 1.0;
                                ctx.shadowBlur = 4;
                                ctx.shadowColor = 'rgba(166, 188, 255, 0.4)';
                            }
                            ctx.stroke();
                        }
                    }
                }
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const sStar = shootingStars[i];
                sStar.update();
                sStar.draw(ctx);
                if (!sStar.active) {
                    shootingStars.splice(i, 1);

            requestAnimationFrame(animateCanvas);

            vaultModalTitle.innerText = "Log In to Cosmic Vault";

            vaultModalBody.innerHTML = `
                <div class="form-card">
                    <div style="font-size: 0.82rem; color: #b0c4de; margin-bottom: 16px; line-height: 1.5;">
                        Enter your unique username and password to access your vault and stars.
                    </div>

                    <div id="loginErrorMsg" class="form-error"></div>

                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password">
                    </div>

                    <button class="btn-primary" id="btnSubmitLogin" style="width: 100%; padding: 12px; margin-top: 6px;">🔑 Log In to Vault</button>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 0.75rem;">
                        <span style="color: #a6bcff; cursor: pointer; text-decoration: underline;" id="btnBackFromLogin">← Back to Options</span>
                        <span style="color: #ffd166; cursor: pointer;" id="btnGoForgot">Forgot Password? (Reset Key) ✦</span>
                    </div>
                </div>
            `;

            const unameInput = document.getElementById('loginUsername');
            const passInput = document.getElementById('loginPassword');
            const errEl = document.getElementById('loginErrorMsg');
            const submitBtn = document.getElementById('btnSubmitLogin');

            async function doLogin() {
                const username = unameInput.value.trim();
                const password = passInput.value;
                errEl.style.display = 'none';

                if (!username || !password) {
                    errEl.innerText = "⚠️ Please enter both username and password.";
                    errEl.style.display = 'block';
                    return;
                }

                submitBtn.innerText = "Authenticating...";
                const uname = username.toLowerCase();
                const inputPassHash = await sha256Hex(uname + ":" + password);

                const cloudAcc = await getCloudAccount(username);
                submitBtn.innerText = "🔑 Log In to Vault";

                if (!cloudAcc || cloudAcc.p !== inputPassHash) {
                    errEl.innerText = "⚠️ Invalid username or password. Please check your credentials or reset your password.";
                    errEl.style.display = 'block';
                    showToast("⚠️ Login failed. Incorrect credentials.");
                    return;
                }

                // Cache locally
                saveLocalAccount(username, inputPassHash, cloudAcc.r || '');

                // Successful login
                activeUsername = username;
                localStorage.setItem('midnight_active_username', activeUsername);
                activeKeyHash = await sha256Hex("user:" + uname);

                updateVaultHeaderButton();
                renderStars();
                renderActiveVaultView();
                trackCurrentPresence();
                showToast(`✨ Welcome back, ${activeUsername}!`);
            }

            submitBtn.addEventListener('click', doLogin);
            passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
            document.getElementById('btnBackFromLogin').addEventListener('click', renderChoiceView);
            document.getElementById('btnGoForgot').addEventListener('click', renderForgotPasswordView);
        }

        // VIEW 5: Forgot Password View (Username + Secret Recovery Key + New Password)
        function renderForgotPasswordView() {
            vaultModalTitle.innerText = "Reset Password with Recovery Key";

            vaultModalBody.innerHTML = `
                <div class="form-card">
                    <div style="font-size: 0.82rem; color: #b0c4de; margin-bottom: 16px; line-height: 1.5;">
                        Enter your username and the secret <strong>Recovery Key</strong> you saved during registration to set a new password.
                    </div>

                    <div id="resetErrorMsg" class="form-error"></div>

                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="resetUsername" placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Secret Recovery Key</label>
                        <input type="text" class="form-input" id="resetRecoveryKey" placeholder="e.g. ethereal-sapphire-whisper-zenith-492" style="font-family: 'Fira Code', monospace; font-size: 0.84rem;">
                    </div>

                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-input" id="resetNewPassword" placeholder="Enter new password (min 4 characters)">
                    </div>

                    <button class="btn-primary" id="btnSubmitReset" style="width: 100%; padding: 12px; margin-top: 6px;">🔄 Reset Password & Log In</button>

                    <div style="display: flex; justify-content: flex-start; align-items: center; margin-top: 14px; font-size: 0.75rem;">
                        <span style="color: #a6bcff; cursor: pointer; text-decoration: underline;" id="btnBackFromReset">← Back to Log In</span>
                    </div>
                </div>
            `;

            const unameInput = document.getElementById('resetUsername');
            const recInput = document.getElementById('resetRecoveryKey');
            const passInput = document.getElementById('resetNewPassword');
            const errEl = document.getElementById('resetErrorMsg');
            const submitBtn = document.getElementById('btnSubmitReset');

            async function doReset() {
                const username = unameInput.value.trim();
                const recoveryKey = recInput.value.trim();
                const newPassword = passInput.value;
                errEl.style.display = 'none';

                if (!username || !recoveryKey || !newPassword) {
                    errEl.innerText = "⚠️ Please fill in all fields.";
                    errEl.style.display = 'block';
                    return;
                }

                if (newPassword.length < 4) {
                    errEl.innerText = "⚠️ New password must be at least 4 characters.";
                    errEl.style.display = 'block';
                    return;
                }

                submitBtn.innerText = "Verifying...";
                const uname = username.toLowerCase();
                const recHash = await sha256Hex(recoveryKey);
                const newPassHash = await sha256Hex(uname + ":" + newPassword);

                const cloudAcc = await getCloudAccount(username);
                submitBtn.innerText = "🔄 Reset Password & Log In";

                if (!cloudAcc || cloudAcc.r !== recHash) {
                    errEl.innerText = "⚠️ Incorrect username or Secret Recovery Key. Reset failed.";
                    errEl.style.display = 'block';
                    showToast("⚠️ Password reset failed.");
                    return;
                }

                // Update in cloud and local
                await updateCloudPassword(cloudAcc.id, username, newPassHash, recHash);

                // Log in
                activeUsername = username;
                localStorage.setItem('midnight_active_username', activeUsername);
                activeKeyHash = await sha256Hex("user:" + uname);

                updateVaultHeaderButton();
                renderStars();
                renderActiveVaultView();
                trackCurrentPresence();
                showToast("✨ Password reset successfully! Welcome back.");
            }

            submitBtn.addEventListener('click', doReset);
            passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
            document.getElementById('btnBackFromReset').addEventListener('click', renderLoginView);
        }

        // VIEW 6: Active Logged In Vault Dashboard
        function renderActiveVaultView() {
            vaultModalTitle.innerText = `${activeUsername}'s Sanctuary`;

            const myThoughts = thoughtsArr
                .map((t, idx) => ({ ...t, originalIndex: idx }))
                .filter(t => isThoughtMine(t));

            const totalWarmth = myThoughts.reduce((acc, t) => acc + (t.warmth || 0), 0);
            const totalResonate = myThoughts.reduce((acc, t) => acc + (t.resonate || 0), 0);

            let listHtml = '';
            if (myThoughts.length === 0) {
                listHtml = `<div class="empty-vault-state">You have not cast any thoughts with this vault yet. Cast a secret into the night and it will shine here!</div>`;
            } else {
                listHtml = myThoughts.reverse().map(thought => `
                    <div class="my-thought-card" data-idx="${thought.originalIndex}">
                        <div class="my-thought-quote">"${thought.text}"</div>
                        <div class="my-thought-meta">
                            <span>🕒 ${formatThoughtTime(thought.created_at)}</span>
                            <div class="my-thought-stats">
                                <span>✨ ${thought.warmth || 0}</span>
                                <span>🤍 ${thought.resonate || 0}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            vaultModalBody.innerHTML = `
                <!-- Vault Status Banner -->
                <div style="background: rgba(8, 22, 40, 0.85); border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 18px; padding: 14px 20px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 1.1rem;">🔒</span>
                        <div>
                            <div style="font-size: 0.82rem; color: #a5f3fc; font-weight: 600; letter-spacing: 0.5px;">
                                Logged in as: <strong>${activeUsername}</strong>
                            </div>
                            <div style="font-size: 0.72rem; color: #8da2c0;">
                                Anonymous Identity Encrypted & Active
                            </div>
                        </div>
                    </div>
                    <button class="btn-danger" id="btnLogoutUser">🚪 Log Out</button>
                </div>

                <!-- Stats summary -->
                <div style="display: flex; gap: 12px; margin-bottom: 18px;">
                    <div style="flex: 1; background: rgba(16, 36, 64, 0.6); border: 1px solid rgba(166, 188, 255, 0.2); border-radius: 14px; padding: 12px; text-align: center;">
                        <div style="font-size: 1.2rem; font-weight: 700; color: #00f0ff;">${myThoughts.length}</div>
                        <div style="font-size: 0.72rem; color: #8da2c0; text-transform: uppercase; letter-spacing: 1px;">Stars Cast</div>
                    </div>
                    <div style="flex: 1; background: rgba(16, 36, 64, 0.6); border: 1px solid rgba(166, 188, 255, 0.2); border-radius: 14px; padding: 12px; text-align: center;">
                        <div style="font-size: 1.2rem; font-weight: 700; color: #ffd166;">✨ ${totalWarmth}</div>
                        <div style="font-size: 0.72rem; color: #8da2c0; text-transform: uppercase; letter-spacing: 1px;">Warmth Received</div>
                    </div>
                    <div style="flex: 1; background: rgba(16, 36, 64, 0.6); border: 1px solid rgba(166, 188, 255, 0.2); border-radius: 14px; padding: 12px; text-align: center;">
                        <div style="font-size: 1.2rem; font-weight: 700; color: #ffffff;">🤍 ${totalResonate}</div>
                        <div style="font-size: 0.72rem; color: #8da2c0; text-transform: uppercase; letter-spacing: 1px;">Resonated</div>
                    </div>
                </div>

                <!-- Messages List -->
                <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; color: #a5f3fc; font-weight: 600; margin-bottom: 10px;">
                    Your Casted Stars (${myThoughts.length})
                </div>
                <div class="my-thoughts-list">${listHtml}</div>
            `;

            document.getElementById('btnLogoutUser').addEventListener('click', () => {
                activeUsername = null;
                activeKeyHash = null;
                localStorage.removeItem('midnight_active_username');
                updateVaultHeaderButton();
                renderStars();
                renderChoiceView();
                trackCurrentPresence();
                showToast("🚪 Logged out. You are now in Guest Mode.");
            });

            document.querySelectorAll('.my-thought-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.idx);
                    closeVaultModal();
                    openThoughtModal(idx);
                });
            });
        }

        /* ==========================================================================
           CASTING INTERFACE (v11)
           ========================================================================== */
        const thoughtInput = document.getElementById('thoughtInput');
        const castBtn = document.getElementById('castBtn');
        const charCount = document.getElementById('charCount');

        thoughtInput.addEventListener('input', () => {
            charCount.innerText = `${thoughtInput.value.length}/250`;
        });

        async function castThought() {
            const text = thoughtInput.value.trim();
            if (!text) return;

            const coordX = Number((Math.random() * 84 + 8).toFixed(2));
            const coordY = Number((Math.random() * 50 + 18).toFixed(2));

            const tempId = "local_" + Date.now().toString();
            const nowIso = new Date().toISOString();

            let newThought = {
                id: tempId,
                text: text,
                warmth: 1,
                resonate: 0,
                color_index: 0,
                author_key: activeKeyHash || null,
                created_at: nowIso,
                x: coordX,
                y: coordY
            };

            if (!activeKeyHash) {
                guestThoughtIds.add(tempId);
                localStorage.setItem('midnight_guest_thoughts', JSON.stringify([...guestThoughtIds]));
            }

            thoughtsArr.push(newThought);
            saveThoughtsLocal();
            createStarElement(newThought, thoughtsArr.length - 1);
            updateTotalThoughtsCount();
            updateVaultHeaderButton();

            audio.playCastShimmer();
            const sStar = new ShootingStar();
            shootingStars.push(sStar);

            thoughtInput.value = '';
            charCount.innerText = '0/250';
            castBtn.innerText = "Casted ✨";
            showToast("Your thought has taken its place among the stars.");

            setTimeout(() => {
                castBtn.innerText = "Cast Into the Night";
            }, 2200);

            if (dbClient) {
                try {
                    let { data, error } = await dbClient
                        .from('thoughts')
                        .insert([
                            {
                                text: text,
                                warmth: 1,
                                resonate: 0,
                                color_index: 0,
                                author_key: activeKeyHash || null,
                                x: coordX,
                                y: coordY
                            }
                        ])
                        .select();

                    if (error) {
                        console.warn("Supabase insert notice, fallback retry:", error.message);
                        const retryRes = await dbClient
                            .from('thoughts')
                            .insert([
                                {
                                    text: text,
                                    warmth: 1,
                                    resonate: 0,
                                    color_index: 0,
                                    x: coordX,
                                    y: coordY
                                }
                            ])
                            .select();
                        if (retryRes.data && retryRes.data.length > 0) {
                            const cloudId = retryRes.data[0].id.toString();
                            newThought.id = cloudId;
                            if (retryRes.data[0].created_at) {
                                newThought.created_at = retryRes.data[0].created_at;
                            }
                            if (!activeKeyHash) {
                                guestThoughtIds.add(cloudId);
                                localStorage.setItem('midnight_guest_thoughts', JSON.stringify([...guestThoughtIds]));
                            }
                            saveThoughtsLocal();
                        }
                    } else if (data && data.length > 0) {
                        const cloudId = data[0].id.toString();
                        newThought.id = cloudId;
                        if (data[0].created_at) {
                            newThought.created_at = data[0].created_at;
                        }
                        if (!activeKeyHash) {
                            guestThoughtIds.add(cloudId);
                            localStorage.setItem('midnight_guest_thoughts', JSON.stringify([...guestThoughtIds]));
                        }
                        saveThoughtsLocal();
                    }
                } catch(err) {
                    console.warn("Supabase network notice:", err.message);
                }
            }
        }

        castBtn.addEventListener('click', castThought);
        thoughtInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                castThought();
            }
        });

        const constellationToggle = document.getElementById('constellationToggle');
        constellationToggle.addEventListener('click', () => {
            showConstellations = !showConstellations;
            constellationToggle.classList.toggle('active', showConstellations);
            showToast(showConstellations ? "Constellations revealed" : "Constellations hidden");
        });

        const audioToggle = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        audioToggle.addEventListener('click', () => {
            const active = audio.toggle();
            audioToggle.classList.toggle('active', active);
            audioIcon.innerText = active ? '🌌' : '🔇';
            showToast(active ? "Ambient night audio enabled" : "Audio muted");
        });

        const toast = document.getElementById('toast');
        let toastTimeout = null;
        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loadThoughts();
        initRealtime();
    </script>
</body>
</html>
